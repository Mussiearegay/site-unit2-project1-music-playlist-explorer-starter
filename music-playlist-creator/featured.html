<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Featured Playlist - Music Playlist Explorer</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>Music Explorer</h1>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="featured.html" class="nav-link active">Featured</a>
            <a href="favorites.html" class="nav-link">Favorites</a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="main-container">
        <header class="main-header">
            <h2 class="greeting">Featured Playlist</h2>
            <div class="header-controls">
                <div class="search-container">
                    <input type="search" class="search-input" id="searchInput" placeholder="Search songs...">
                    <div class="search-results" id="searchResults" hidden>
                        <!-- Search results will appear here -->
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- Featured Playlist Hero Section -->
            <section class="featured-hero">
                <div class="featured-cover-container">
                    <img src="" alt="Featured playlist cover" class="featured-cover" id="featuredCover">
                </div>
                <div class="featured-info">
                    <p class="featured-label">FEATURED PLAYLIST</p>
                    <h1 class="featured-title" id="featuredTitle">Loading...</h1>
                    <p class="featured-creator" id="featuredCreator"></p>
                    <p class="featured-description" id="featuredDescription"></p>
                    <button class="ai-description-button" id="featuredAiButton">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        Get AI Description
                    </button>
                    <p class="ai-description-result" id="featuredAiResult" style="display: none;"></p>
                    <div class="featured-actions">
                        <button class="shuffle-button" id="featuredShuffle">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                            </svg>
                            Shuffle
                        </button>
                        <button class="featured-like-button" id="featuredLike" aria-label="Like playlist">
                            <svg class="like-icon" viewBox="0 0 24 24" width="24" height="24">
                                <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </button>
                        <span class="featured-like-count" id="featuredLikeCount">0 likes</span>
                    </div>
                </div>
            </section>

            <!-- Featured Playlist Tracklist -->
            <section class="featured-tracklist">
                <h3 class="tracklist-title">Songs</h3>
                <ul class="song-list" id="featuredSongList">
                    <!-- Songs will be dynamically generated here -->
                </ul>
            </section>
        </main>

        <footer class="main-footer">
            <p>&copy; 2024 Music Playlist Explorer</p>
        </footer>
    </div>

    <script src="data/data.js"></script>
    <script src="featured.js"></script>
</body>
</html>
