<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test OpenRouter API</title>
</head>
<body>
    <h1>OpenRouter API Test</h1>
    <button id="testBtn">Test API Call</button>
    <pre id="result"></pre>

    <script>
        const OPENROUTER_API_KEY = 'YOUR_OPENROUTER_API_KEY_HERE'; // Replace with your OpenRouter API key

        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';

            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'API Test'
                    },
                    body: JSON.stringify({
                        model: 'meta-llama/llama-3.1-8b-instruct:free',
                        messages: [
                            { role: 'user', content: 'Say hello in one sentence.' }
                        ]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    resultEl.textContent = `ERROR ${response.status}:\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultEl.textContent = `SUCCESS:\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultEl.textContent = `EXCEPTION:\n${error.message}\n${error.stack}`;
            }
        });
    </script>
</body>
</html>
